name: release-skill-installer

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: linux-amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: darwin-arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: windows-amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: skill-installer/go.mod

      - name: Build
        shell: bash
        run: |
          mkdir -p skill-installer/dist
          cd skill-installer
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o dist/skill-installer-${{ matrix.asset }}${{ matrix.ext }} ./cmd/installer

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: skill-installer/dist/*
